# One Prometheus for one server. Scrape interval is 5s rather than the usual
# 15s because the fast burn-rate alert in docs/slo.md uses a 5-minute short
# window; at 15s that window holds 20 samples, which is thin for a rate() that
# is allowed to page someone.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    host: one-box

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: reward-serve
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8000"]
        labels:
          service: reward-serve

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
