# Lint rules for reward-serve. Pinned explicitly rather than left to ruff's
# defaults so that a ruff upgrade cannot turn a green CI red on its own.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  "E501",    # line length is checked by the formatter, not as an error
  "RUF007",  # zip(xs, xs[1:]) reads more plainly than itertools.pairwise here
]

[lint.per-file-ignores]
# The dry run must clear CUDA_VISIBLE_DEVICES and fix sys.path before importing
# torch or the package, so its imports cannot all sit at the top.
"scripts/forward_dry_run.py" = ["E402"]
# Tests reach into prometheus_client internals to assert bucket edges.
"tests/*" = ["SLF001", "SIM117"]
# Pre-existing CI gate scripts; their broad excepts are deliberate (a probe must
# never be the reason a measurement fails to start).
"scripts/box_quiet.py" = ["SIM105"]
