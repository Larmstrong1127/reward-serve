name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: tests, lint, types, vocabulary
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Forbidden scale vocabulary
        run: python scripts/vocab_gate.py .
      - name: Lint
        run: ruff check .
      - name: Types
        run: |
          mypy --strict reward_serve
          mypy --strict loadgen
      - name: Tests (CPU only)
        run: pytest -q
