[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reward-serve"
version = "0.1.0"
description = "Continuous-batching inference server for a DeBERTa pairwise reward model, on one machine."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "torch>=2.4,<3.0",
    "transformers>=4.57,<6.0",
    "pydantic>=2.9,<3.0",
    "httpx>=0.27,<0.30",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.21",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "datasets>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.2",
    "ruff>=0.7,<0.15",
    "mypy>=1.13,<2.0",
    "psutil>=6.0",
    "hypothesis>=6.100,<7.0",
]

[tool.setuptools.packages.find]
include = ["reward_serve*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "uvicorn.*", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: spawns real processes and waits for sockets; the multi-tier integration checks",
]
